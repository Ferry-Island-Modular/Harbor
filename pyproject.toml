[project]
classifiers = ["Private :: Do Not Upload"]
name = "fim-config-tool"
version = "0.1.0"
description = " Configuration app for Ferry Island Modular products."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.3.4",
    "pyinstaller>=6.16.0",
    "pyside6>=6.10.0",
    "scipy>=1.16.3",
]
[project.scripts]
fim-config-tool = "config_tool.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_tool"]

name: cpp-ci

on:
  push:
    branches: [master, cpp-qt-rewrite]
    paths:
      - 'src/**'
      - '.github/workflows/cpp-ci.yml'
  pull_request:
    branches: [master, cpp-qt-rewrite]
    paths:
      - 'src/**'
      - '.github/workflows/cpp-ci.yml'
  workflow_dispatch:

jobs:
  lint:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        working-directory: src
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            qt_version: '6.10.2'
          # Qt 6.8's macOS package references Apple's removed AGL framework.
          # Qt 6.10 supports macOS 26; keep the established 6.8 package on
          # Linux and Windows until a broader upgrade is useful.
          - os: ubuntu-latest
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_version: '6.8.3'
          - os: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_version: '6.8.3'
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_version: '6.8.3'

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libfontconfig1 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libpulse-dev \
            libasound2-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Node (for dart-sass)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: cmake -B build -G Ninja

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        run: cmake -B build -A x64

      - name: Build (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        run: cmake --build build --parallel --config Release

      - name: Test (Unix)
        if: runner.os != 'Windows'
        working-directory: src
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        working-directory: src
        run: ctest --test-dir build --output-on-failure -C Release

      # ---- Bundle + upload ----
      # Note: CMake's OUTPUT_NAME for fim-config-tool is "Harbor" on
      # macOS/Windows and "harbor" on Linux. The .app and .exe and Linux
      # binary all use those names, NOT "fim-config-tool".

      # Linux: build a self-contained AppImage via linuxdeploy + Qt plugin.
      # Builds on both x86_64 and aarch64 runners; uses uname -m to pick
      # the matching linuxdeploy AppImages and tag the artifact name.
      - name: Bundle as AppImage (Linux)
        if: runner.os == 'Linux'
        working-directory: src
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'  # CI runners can lack FUSE
          # linuxdeploy-plugin-qt deploys only platforms/libqxcb.so by default;
          # without these the AppImage has no Wayland support at all.
          EXTRA_QT_PLUGINS: 'wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration'
        run: |
          ARCH=$(uname -m)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${ARCH}.AppImage
          chmod +x linuxdeploy-*.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp build/harbor AppDir/usr/bin/
          cp resources/icon/harbor-source.png AppDir/usr/share/icons/hicolor/512x512/apps/harbor.png
          cat > AppDir/usr/share/applications/harbor.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Harbor
          Exec=harbor
          Icon=harbor
          Categories=Utility;
          EOF
          qt_plugins="${QT_ROOT_DIR:-${Qt6_DIR:-}}/plugins"
          if [ -d "${qt_plugins}/platforms" ]; then
            mkdir -p AppDir/usr/plugins/platforms
            find "${qt_plugins}/platforms" -name 'libqwayland*.so' \
              -exec cp -v {} AppDir/usr/plugins/platforms/ \; || true
          fi
          # Copying the plugin in is not enough: linuxdeploy only resolves
          # dependencies for files it deploys itself, so a hand-copied plugin
          # ships without libQt6WaylandClient.so.6 and Qt reports "could not
          # load ... even though it was found". --deploy-deps-only makes it
          # walk an already-present file's dependencies.
          deploy_deps_args=()
          for plugin in AppDir/usr/plugins/platforms/libqwayland*.so; do
            [ -e "$plugin" ] || continue
            deploy_deps_args+=("--deploy-deps-only=$plugin")
          done
          ./linuxdeploy-${ARCH}.AppImage --appdir AppDir --plugin qt \
            "${deploy_deps_args[@]}" --output appimage

          echo "Bundled platform plugins:"
          ls -1 AppDir/usr/plugins/platforms/
          if ! ls AppDir/usr/plugins/platforms/ | grep -q '^libqwayland'; then
            echo "::error::No Wayland platform plugin in the AppImage." >&2
            exit 1
          fi
          failed=0
          for plugin in AppDir/usr/plugins/platforms/libqwayland*.so; do
            missing="$(LD_LIBRARY_PATH=AppDir/usr/lib ldd "$plugin" | grep 'not found' || true)"
            if [ -n "$missing" ]; then
              echo "::error::$(basename "$plugin") has unresolved dependencies:" >&2
              echo "$missing" >&2
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "All Wayland plugins resolve against the bundled libraries."

      - name: Smoke-test AppImage on a clean system
        if: runner.os == 'Linux'
        working-directory: src
        run: |
          set -euo pipefail
          # This runner has libgl1-mesa-dev installed, which pulls libopengl0
          # transitively, so launching here proves nothing about a user's
          # machine. Verify against a bare ubuntu:24.04 with only the packages
          # resources/dist/README-Linux.txt tells users to install.
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash -euc '
            apt-get update -qq

            # ubuntu:24.04 is a server image with no graphical stack at all,
            # so it is stricter than any real desktop. Install the libraries
            # every graphical Linux system already has, so the test only fails
            # on dependencies a user would genuinely be missing.
            apt-get install -y -qq \
              libfontconfig1 libfreetype6 libx11-6 libxcb1 \
              libxkbcommon0 libglib2.0-0t64 libdbus-1-3 > /dev/null

            # Exactly what resources/dist/README-Linux.txt tells users to
            # install. Keep these two lists in step.
            apt-get install -y -qq libgl1 libglx0 libopengl0 libegl1 > /dev/null

            cd /tmp
            cp /src/Harbor*.AppImage ./harbor.AppImage
            chmod +x ./harbor.AppImage
            ./harbor.AppImage --appimage-extract > /dev/null
            missing="$(ldd squashfs-root/usr/bin/harbor | grep "not found" || true)"
            if [ -n "$missing" ]; then
              echo "::error::Undeclared runtime dependencies in the AppImage" >&2
              echo "$missing" >&2
              exit 1
            fi
            echo "All runtime libraries resolve with only the documented packages installed."
          '

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fim-config-tool-linux-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          path: src/Harbor*.AppImage
          if-no-files-found: error
          retention-days: 14

      # Windows: create an NSIS per-user installer plus a portable ZIP.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --version=3.12.0 --yes --no-progress

      - name: Package Windows installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./src/scripts/package-windows.ps1 -SkipBuild -BuildDir src/build

      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fim-config-tool-windows
          path: |
            src/build/dist/Harbor-*-windows-x64-setup.exe
            src/build/dist/Harbor-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

      # macOS: reuse the existing package-macos.sh which handles
      # macdeployqt's Info.plist quirk + ad-hoc codesign + DMG layout.
      # --skip-build avoids re-running cmake --build in the script.
      - name: Bundle as DMG (macOS)
        if: runner.os == 'macOS'
        run: src/scripts/package-macos.sh --skip-build

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: fim-config-tool-macos
          path: src/build/dist/Harbor-*.dmg
          if-no-files-found: error
          retention-days: 14
